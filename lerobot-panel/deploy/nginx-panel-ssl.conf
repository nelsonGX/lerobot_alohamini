# HTTPS for the AlohaMini panel (the iPad at /kiosk needs HTTPS for the microphone).
# Self-signed certificate in /etc/nginx/ssl; the iPad can install it from http://10.95.27.3/panel-cert.crt.
# $panel_connection_upgrade is defined in panel.test.conf.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 10.95.27.3 panel.test localhost;

    ssl_certificate     /etc/nginx/ssl/panel.crt;
    ssl_certificate_key /etc/nginx/ssl/panel.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $panel_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Camera previews are MJPEG streams and chat audio is pushed live: don't buffer.
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Certificate (self-signed; CA:TRUE, serverAuth and < 825 days so iOS lets you fully trust it):
#   sudo mkdir -p /etc/nginx/ssl && cd /etc/nginx/ssl
#   sudo openssl req -x509 -newkey rsa:2048 -nodes -days 800 -sha256 -keyout panel.key -out panel.crt \
#     -subj "/CN=AlohaMini Panel" -addext "subjectAltName=IP:<panel-ip>,DNS:panel.test,DNS:localhost" \
#     -addext "basicConstraints=critical,CA:TRUE" \
#     -addext "keyUsage=critical,digitalSignature,keyEncipherment,keyCertSign" -addext "extendedKeyUsage=serverAuth"
#   sudo cp panel.crt /var/www/html/panel-cert.crt    # so the iPad can download it over plain HTTP
#   sudo nginx -t && sudo systemctl reload nginx
